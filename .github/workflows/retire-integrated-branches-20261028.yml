# This one-time branch retirement runs exclusively from default-branch commits.
# Exact source heads are saved in archive Git tags before deleting each ref.
name: Retire merged or ancestor-only source refs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-integrated-branches-20261028.yml']
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Independently qualify and archive each original branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
            'feat/prov-revision-impact-research-20261027'
          )
          open_prs="$(gh api "repos/$REPO/pulls?state=open&per_page=100")"
          for branch in "${branches[@]}"; do
            [[ "$branch" != main && "$branch" != release/* && "$branch" != automation-state ]] || exit 1
            count="$(jq -r --arg b "$branch" '[.[] | select(.head.ref == $b)] | length' <<< "$open_prs")"
            [[ "$count" == 0 ]] || { echo "::error::$branch is an open PR head"; exit 1; }
            data="$(gh api "repos/$REPO/branches/$branch")"
            tip="$(jq -r '.commit.sha' <<< "$data")"
            [[ "$(jq -r '.protected' <<< "$data")" == false && "$tip" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cmp="$(gh api "repos/$REPO/compare/main...$branch")"
            status="$(jq -r '.status' <<< "$cmp")"
            [[ "$(jq -r '.ahead_by' <<< "$cmp")" == 0 && ( "$status" == behind || "$status" == identical ) ]] ||
              { echo "::error::$branch is NOT fully contained in main"; exit 1; }
            tag_path="archive/2026-10-28/$branch"
            if gh api "repos/$REPO/git/ref/tags/$tag_path" >/tmp/archive.json 2>/dev/null; then
              [[ "$(jq -r '.object.sha' /tmp/archive.json)" == "$tip" ]] || exit 1
            else
              gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag_path" -f sha="$tip" >/dev/null
            fi
            [[ "$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')" == "$tip" ]] || exit 1
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null
            echo "RETIRED $branch source_commit=$tip preserved_as=$tag_path"
          done
