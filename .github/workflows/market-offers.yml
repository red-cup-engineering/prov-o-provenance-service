name: market-offers
# Autosell, package side. This package declares `package.json#x-market`; on every push to main the house
# derive-market-offers workflow derives its market offers from the package itself and reconciles them with the live
# catalog (causeway-services/public-market-services-section data/catalog.json, the `parameters` of market.561.group).
#
#   - HOUSE_READ_TOKEN absent (the default for a public repository): nothing runs. The x402 source, the catalog and the
#     agency records are private; there is nothing to reconcile against.
#   - HOUSE_READ_TOKEN present, MARKET_CATALOG_TOKEN absent: the reconciled catalog, report and diff are uploaded as the
#     `derive-market-offers` artifact; no pull request is opened.
#   - Both present: one pull request per package repository is opened or updated in the catalog repository. It is never
#     merged by this workflow; merging is the reviewed act that puts offers on sale, and new offers start `held`.
#
# Derivation imports the package's own code, so it runs on push, never on pull_request. Pins: the workflow (continuous-
# delivery-engineering-services-section), the derivation tool (x402-engineering-services-section) and the agency records
# (engineering-services-section for the enterprise record, the catalog repository for agency-index.json) are exact commits.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      read: ${{ steps.token.outputs.read }}
    steps:
      - id: token
        env:
          HOUSE_READ_TOKEN: ${{ secrets.HOUSE_READ_TOKEN }}
        run: |
          if [ -n "$HOUSE_READ_TOKEN" ]; then echo "read=true" >> "$GITHUB_OUTPUT"
          else echo "read=false" >> "$GITHUB_OUTPUT"; echo "::notice title=market-offers skipped::HOUSE_READ_TOKEN is not set; the private x402 source, catalog and agency records cannot be read."; fi
  market:
    runs-on: ${{ fromJSON(('["ubuntu-24.04"]')) }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.reconcile.outputs.drift }}
      refused: ${{ steps.reconcile.outputs.refused }}
      can-propose: ${{ steps.tokens.outputs.can-propose }}
    steps:
      - name: Require the read token and a pinned x402 commit; note whether a catalog pull request can be opened
        id: tokens
        env:
          CATALOG_TOKEN: ${{ (secrets.MARKET_CATALOG_TOKEN) }}
          READ_TOKEN: ${{ (secrets.HOUSE_READ_TOKEN) }}
          X402_REF: ${{ ('611fdfe39486d975771df862c512357d25c4dbc4') }}
        run: |
          [ -n "$READ_TOKEN" ] || { echo "::error title=Missing secret house-read-token::The x402 source and the agency records are private. An existing authorized read-token binding is required."; exit 1; }
          printf '%s' "$X402_REF" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error title=Unpinned x402-ref::x402-ref must be one 40-character commit, not a branch or tag."; exit 1; }
          # The pull request is opened with a token scoped to the catalog repository; this workflow does not create credentials.
          # Without one the run still derives and reconciles, and the diff is an artifact.
          if [ -n "$CATALOG_TOKEN" ]; then echo "can-propose=true" >> "$GITHUB_OUTPUT"
          else echo "can-propose=false" >> "$GITHUB_OUTPUT"; echo "::notice title=No catalog-token::No catalog pull request will be opened; the reconciled catalog and diff are uploaded as the derive-market-offers artifact."; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: package
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: red-cup-engineering/x402-engineering-services-section
          ref: ${{ ('611fdfe39486d975771df862c512357d25c4dbc4') }}
          token: ${{ (secrets.HOUSE_READ_TOKEN) }}
          path: x402
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ ('causeway-services/public-market-services-section') }}
          ref: ${{ ('main') }}
          token: ${{ (secrets.HOUSE_READ_TOKEN) }}
          path: catalog
          persist-credentials: false
      - name: Check out the agency records read-only
        env:
          CHECKOUTS: ${{ ('[{"repository":"red-cup-engineering/engineering-services-section","ref":"f1422ec622d5bf0b6c94ebb3f9416f6c6b077d3d","path":"services/561-group/services/engineering-services-section"},{"repository":"causeway-services/public-market-services-section","ref":"0cab176b779a5599b19b8475445031925371ba85","path":"market"}]') }}
          READ_TOKEN: ${{ (secrets.HOUSE_READ_TOKEN) }}
        run: |
          mkdir -p "$RUNNER_TEMP/agency"
          printf '%s' "$CHECKOUTS" | jq -r '.[] | [.repository, .ref, .path] | @tsv' | while IFS=$'\t' read -r repository ref path; do
            case "$path" in ''|/*|*..*) echo "::error::agency checkout path must be relative and inside the agency directory"; exit 1 ;; esac
            printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::agency checkout $repository needs a 40-character ref"; exit 1; }
            git init -q "$RUNNER_TEMP/agency/$path"
            git -C "$RUNNER_TEMP/agency/$path" -c "http.extraheader=Authorization: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)" \
              fetch -q --depth=1 "https://github.com/$repository.git" "$ref"
            git -C "$RUNNER_TEMP/agency/$path" checkout -q FETCH_HEAD
          done
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install the derivation tool and the packages' own dependencies, without install scripts
        env:
          PACKAGE_PATHS: ${{ ('["."]') }}
          npm_config_registry: https://registry.561.group/
        run: |
          registry_args=(--registry=https://registry.561.group/)
          for scope in @561-group @causeway-services @coesite-operations @emsenn @emsweb @harmonious-union @koios-news @lenticule-science @red-cup-engineering @red-cup-science @rsc-quiescent @turntide-islands @union-officer-academy; do
            registry_args+=("--${scope}:registry=https://registry.561.group/")
          done
          (cd x402 && npm install --no-audit --no-fund --ignore-scripts "${registry_args[@]}")
          printf '%s' "$PACKAGE_PATHS" | jq -r '.[]' | while read -r dir; do
            (cd "package/$dir" && { if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund "${registry_args[@]}"; else npm install --ignore-scripts --no-audit --no-fund "${registry_args[@]}"; fi; })
          done
      - name: Derive offers and reconcile with the catalog
        id: reconcile
        env:
          PACKAGE_PATHS: ${{ ('["."]') }}
          CATALOG_PATH: ${{ ('data/catalog.json') }}
          AGENCY_INDEX: ${{ ('market/data/agency-index.json') }}
          ORIGIN: ${{ ('') }}
        run: |
          set +e
          dirs=$(printf '%s' "$PACKAGE_PATHS" | jq -r '.[] | "package/" + .')
          origin=(); [ -z "$ORIGIN" ] || origin=(--origin "$ORIGIN")
          # shellcheck disable=SC2086
          node x402/apps/derive-market-offers.mjs --catalog "catalog/$CATALOG_PATH" --agency "$RUNNER_TEMP/agency/$AGENCY_INDEX" "${origin[@]}" \
            --out "$RUNNER_TEMP/catalog.next.json" --report "$RUNNER_TEMP/reconciliation.json" --summary "$RUNNER_TEMP/summary.md" $dirs
          code=$?
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo "drift=$(jq -r '.drift // false' "$RUNNER_TEMP/reconciliation.json" 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"
          echo "refused=$([ "$code" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # 0 reconciled, 1 a package or operation refused (the diff for the rest is still proposed), anything else is a tool failure.
          [ "$code" = 0 ] || [ "$code" = 1 ] || exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: derive-market-offers
          path: |
            ${{ runner.temp }}/catalog.next.json
            ${{ runner.temp }}/reconciliation.json
            ${{ runner.temp }}/summary.md
          if-no-files-found: warn
      - name: Fail the run when a package or operation was refused
        if: ${{ steps.reconcile.outputs.refused == 'true' }}
        run: echo "::error title=Market offers refused::A package or operation could not be derived (licence, seller record, service offering, example or schema); see the job summary. Offers that did derive are still proposed."; exit 1
    needs:
      - gate
    if: ${{ needs.gate.outputs.read == 'true' }}
    name: market / derive
  market-propose:
    needs:
      - gate
      - market
    if: ${{ (needs.gate.outputs.read == 'true') && (!cancelled() && needs.market.outputs.drift == 'true' && needs.market.outputs.can-propose == 'true') }}
    runs-on: ${{ fromJSON(('["ubuntu-24.04"]')) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: derive-market-offers
          path: proposal
      - name: Open or update the catalog pull request
        env:
          GH_TOKEN: ${{ (secrets.MARKET_CATALOG_TOKEN) }}
          CATALOG: ${{ ('causeway-services/public-market-services-section') }}
          CATALOG_PATH: ${{ ('data/catalog.json') }}
          BASE: ${{ ('main') }}
          SOURCE: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REFUSED: ${{ needs.market.outputs.refused }}
        run: |
          set -euo pipefail
          branch="autosell/$(printf '%s' "$SOURCE" | tr '/' '-')"
          title="Market offers derived from $SOURCE"
          {
            cat proposal/summary.md
            printf '\nDerived from %s at %s by derive-market-offers. Merging puts the listed changes on sale as declared (held offers stay held).\n' "$SOURCE" "$SHA"
            [ "$REFUSED" != true ] || printf '\nSome packages or operations were refused; their existing rows are unchanged. See the workflow run.\n'
          } > body.md
          # The catalog is changed through the Git data API, as the CD caller generator's source receiver does: one blob, one tree, one commit, no clone.
          # Bodies go through jq and --input because the catalog is far larger than one command-line argument may be.
          api() { gh api "$@"; }
          base_sha=$(api "repos/$CATALOG/git/ref/heads/$BASE" --jq .object.sha)
          blob=$(jq -n --rawfile content proposal/catalog.next.json '{content: $content, encoding: "utf-8"}' | api "repos/$CATALOG/git/blobs" --input - --jq .sha)
          tree=$(jq -n --arg base "$base_sha" --arg path "$CATALOG_PATH" --arg blob "$blob" \
            '{base_tree: $base, tree: [{path: $path, mode: "100644", type: "blob", sha: $blob}]}' | api "repos/$CATALOG/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg message "$title" --arg tree "$tree" --arg parent "$base_sha" \
            '{message: $message, tree: $tree, parents: [$parent]}' | api "repos/$CATALOG/git/commits" --input - --jq .sha)
          if api "repos/$CATALOG/git/ref/heads/$branch" >/dev/null 2>&1; then
            jq -n --arg sha "$commit" '{sha: $sha, force: true}' | api -X PATCH "repos/$CATALOG/git/refs/heads/$branch" --input - >/dev/null
          else
            jq -n --arg ref "refs/heads/$branch" --arg sha "$commit" '{ref: $ref, sha: $sha}' | api "repos/$CATALOG/git/refs" --input - >/dev/null
          fi
          existing=$(api --method GET "repos/$CATALOG/pulls" -f state=open -f head="${CATALOG%%/*}:$branch" --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            jq -n --arg title "$title" --rawfile body body.md '{title: $title, body: $body}' | api -X PATCH "repos/$CATALOG/pulls/$existing" --input - >/dev/null
            echo "Updated catalog pull request #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(jq -n --arg title "$title" --arg head "$branch" --arg base "$BASE" --rawfile body body.md '{title: $title, head: $head, base: $base, body: $body}' \
              | api "repos/$CATALOG/pulls" --input - --jq .html_url)
            echo "Opened catalog pull request $url" >> "$GITHUB_STEP_SUMMARY"
          fi
    name: market / propose
